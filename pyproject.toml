[tool.poetry]
name = "todolist"
version = "0.1.0"
description = "Phase 2: ToDoList CLI application with PostgreSQL persistence"
authors = ["Sam Ghorbani <https://sami-gh05.github.io/personal-portfolio-website/>"]
readme = "README.md"
packages = [{ include = "todolist" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.23"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
schedule = "^1.2.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
httpx = "^0.27.0"
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
ruff = "^0.6.9"
black = "^24.8.0"
isort = "^5.13.2"

[tool.poetry.scripts]
todolist = "todolist.main:main"
api = "todolist.api.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


